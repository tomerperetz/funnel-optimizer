[project]
name = "funnel-optimizer"
version = "0.2.0"
description = "Campaign pipeline for home renovation call center — Meta Ads to lead collection"
requires-python = ">=3.12"
dependencies = [
    "facebook-business>=20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
reports = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
analysis = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "jupyterlab>=4.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
funnel = "funnel_optimizer.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
